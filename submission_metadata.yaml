# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  3-stage hybrid ranking pipeline over 100K candidates for a Senior AI Engineer JD.
  Stage 1: Hard knockout filters eliminate honeypots (fictional companies, expert skills
  with 0 endorsements, title-experience mismatches), unrelated roles (PM/HR/Mechanical),
  pure consulting careers, candidates outside India, and inactive profiles.
  Stage 2: Surviving candidates scored on semantic similarity (BAAI/bge-small-en-v1.5
  cosine sim vs JD embedding, weight 0.35), career evidence (production + retrieval
  keywords co-occurring in same job description, weight 0.35), YOE fit tier scoring
  (6-8yr ideal, weight 0.15), corroborated skill match (skills discounted if career
  history has no retrieval evidence, weight 0.10), and behavioral availability signals
  (notice period, last_active_date, recruiter_response_rate, weight 0.05).
  Six JD-named disqualifiers applied as hard penalties: title chaser, research-only,
  LangChain-only, closed-source only, 120d+ notice, consulting-only career.
  Stage 3: Score sharpening via min-max stretch and power curve to natural 0.38-0.88
  range. Rankings reproduced in under 60 seconds on CPU using precomputed embeddings.

